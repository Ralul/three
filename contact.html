<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="styles/style.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro PC Chess</title>
</head>

<body>
<header>
    <div class="icon logo">
        <a href="index.html" class="logo">
            <img src="/public/logo.png" alt="logo" />
        </a>
    </div>

    <!-- Hamburger icon -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- The menu -->
    <div class="menu">
        <a href="statistics.html" class="menu-link">Statistics</a>
        <a href="rules.html" class="menu-link">Rules</a>
        <a href="features.html" class="menu-link">Features</a>
    </div>
</header>

<div class="menu-overlay" id="menu-overlay"></div>

<div class="background">
    <main class="main">
        <h1>Contact</h1>
        <form class="contact-form">
            <div class="form-group">
                <label for="femail" class="contact-label">E-Mail:</label>
                <input type="email" id="femail" name="femail" class="input contact-email">
            </div>

            <div class="form-group">
                <label for="fusername" class="contact-label">Username:</label>
                <input type="text" id="fusername" name="fusername" class="input contact-username">
            </div>

            <div class="form-group">
                <label for="fmessage" class="contact-label">Message:</label>
                <textarea id="fmessage" name="fmessage" class="input contact-message" rows="10"></textarea>
            </div>

            <button class="submit-button" type="submit">Submit</button>
        </form>
    </main>
</div>
<footer>
    <div class="links">
        <a href="impress.html">Impress</a>
        <a href="contact.html">Contact</a>
    </div>
</footer>
</body>
<script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.querySelector('.menu');
    const overlay = document.getElementById('menu-overlay');

    function toggleMenu() {
        const isOpen = hamburger.classList.toggle('active');
        menu.classList.toggle('show', isOpen);
        overlay.classList.toggle('show', isOpen);
        hamburger.setAttribute('aria-expanded', isOpen);
    }

    hamburger.addEventListener('click', toggleMenu);

    // Clicking outside the menu or overlay closes it
    overlay.addEventListener('click', () => {
        hamburger.classList.remove('active');
        menu.classList.remove('show');
        overlay.classList.remove('show');
        hamburger.setAttribute('aria-expanded', 'false');
    });

    // ---------------------------
    // Form validation logic
    // ---------------------------
    const form = document.querySelector('.contact-form');
    const emailInput = document.getElementById('femail');
    const usernameInput = document.getElementById('fusername');
    const messageInput = document.getElementById('fmessage');

    // Create small error message elements
    function createErrorElement(input) {
        let error = input.parentNode.querySelector('.error-message');
        if (!error) {
            error = document.createElement('div');
            error.className = 'error-message';
            input.parentNode.insertBefore(error, input.nextSibling);
        }
        return error;
    }

    // Attach one under each input initially so spacing stays consistent
    [emailInput, usernameInput, messageInput].forEach((input) => createErrorElement(input));

    form.addEventListener('submit', (event) => {
        let isValid = true;

        // Helper to set errors
        function setError(input, message) {
            const error = createErrorElement(input);
            if (message) {
                error.textContent = message;
                input.classList.add('input-error');
                isValid = false;
            } else {
                error.textContent = '';
                input.classList.remove('input-error');
            }
        }

        // Validate email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailInput.value.trim()) {
            setError(emailInput, 'E-mail is required.');
        } else if (!emailPattern.test(emailInput.value.trim())) {
            setError(emailInput, 'Please enter a valid e-mail address.');
        } else {
            setError(emailInput, '');
        }

        // Validate username
        if (!usernameInput.value.trim()) {
            setError(usernameInput, 'Username is required.');
        } else if (usernameInput.value.trim().length < 2) {
            setError(usernameInput, 'Username must be at least 2 characters long.');
        } else {
            setError(usernameInput, '');
        }

        // Validate message
        if (!messageInput.value.trim()) {
            setError(messageInput, 'Message cannot be empty.');
        } else if (messageInput.value.trim().length < 5) {
            setError(messageInput, 'Message must be at least 5 characters long.');
        } else {
            setError(messageInput, '');
        }

        if (!isValid) {
            event.preventDefault();
        }
    });
</script>
</html>
