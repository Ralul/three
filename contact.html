<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="styles/style.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro PC Chess</title>
</head>

<body>
<header>
    <div class="icon logo">
        <a href="index.html" class="logo">
            <img src="/public/logo.png" alt="logo" />
        </a>
    </div>

    <!-- Hamburger icon -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- The menu -->
    <div class="menu">
        <a href="statistics.html" class="menu-link">Statistics</a>
        <a href="rules.html" class="menu-link">Rules</a>
        <a href="features.html" class="menu-link">Features</a>
    </div>
</header>

<div class="menu-overlay" id="menu-overlay"></div>

<div class="background">
    <main class="main">
        <h1>Contact</h1>
            <form class="contact-form">
                <label for="femail" class="contact-label">E-Mail:</label>
                <br>
                <input type="email" id="femail" name="femail" class="input contact-email">
                <br>
                <label for="fusername" class="contact-label">Username:</label>
                <br>
                <input type="text" id="fusername" name="fusername" class="input contact-username">
                <br>
                <label for="fmessage" class="contact-label">Message:</label>
                <br>
                <textarea id="fmessage" name="fmessage" class="input contact-message" rows="10" cols="50">
                </textarea>
                <br>
                <button class="submit-button" type="submit">Submit</button>
            </form>
    </main>
</div>
<footer>
    <div class="links">
        <a href="impress.html">Impress</a>
        <a href="contact.html">Contact</a>
    </div>
</footer>
</body>
<script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.querySelector('.menu');
    const overlay = document.getElementById('menu-overlay');

    function toggleMenu() {
        const isOpen = hamburger.classList.toggle('active');
        menu.classList.toggle('show', isOpen);
        overlay.classList.toggle('show', isOpen);
        hamburger.setAttribute('aria-expanded', isOpen);
    }

    hamburger.addEventListener('click', toggleMenu);

    // Clicking outside the menu or overlay closes it
    overlay.addEventListener('click', () => {
        hamburger.classList.remove('active');
        menu.classList.remove('show');
        overlay.classList.remove('show');
        hamburger.setAttribute('aria-expanded', 'false');
    });
</script>
</html>
