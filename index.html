<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="styles/style.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro PC Chess</title>
</head>

<body>
<header>
    <div class="icon logo">
        <a href="index.html" class="logo">
            <img src="/public/logo.png" alt="logo" />
        </a>
    </div>

    <!-- Hamburger icon -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- The menu -->
    <div class="menu">
        <a href="index.html" class="menu-link">Statistics</a>
        <a href="index.html" class="menu-link">Rules</a>
        <a href="index.html" class="menu-link">Features</a>
    </div>
</header>

<div class="menu-overlay" id="menu-overlay"></div>

<div class="background">
    <main class="main">
        <h1>Retro PC Chess</h1>
        <p>
            Experience classic chess in a modern 3D world — built with Three.js and TypeScript, right in your browser.
        </p>
        <section class="game">
            <a href="chess.html">
                <img src="/public/chess.png" alt="Image from game" class="chess-game"/>
                <img src="/public/play.png" alt="Play button" class="play-button" />
            </a>
        </section>

        <section class="features">
            <a href="chess.html">
                <p>Want to peek behind the scenes? See what powers the 3D magic.</p>
            </a>
        </section>
    </main>
</div>
<footer>
    <div class="links">
        <a href="impress.html">Impress</a>
        <a href="contact.html">Contact</a>
    </div>
</footer>
</body>
<script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.querySelector('.menu');
    const overlay = document.getElementById('menu-overlay');

    function toggleMenu() {
        const isOpen = hamburger.classList.toggle('active');
        menu.classList.toggle('show', isOpen);
        overlay.classList.toggle('show', isOpen);
        hamburger.setAttribute('aria-expanded', isOpen);
    }

    hamburger.addEventListener('click', toggleMenu);

    // Clicking outside the menu or overlay closes it
    overlay.addEventListener('click', () => {
        hamburger.classList.remove('active');
        menu.classList.remove('show');
        overlay.classList.remove('show');
        hamburger.setAttribute('aria-expanded', 'false');
    });
</script>
</html>
